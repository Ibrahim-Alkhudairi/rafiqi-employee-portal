# Builds the portal on every push to main and deploys it to the Azure App
# Service web app. The only secret it needs is the web app's publish profile;
# the database URL and session secret are app settings on the web app.

name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits instead of cutting one off.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AZURE_WEBAPP_NAME: rafiqi-employee-portal

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Also checks the TypeScript.
      - run: npm run build

      # The standalone server does not include public/ or .next/static; it serves
      # them once they are copied next to it. -L copies the files behind the
      # build's symlink to mssql, so the zip holds no links.
      - name: Assemble the app
        run: |
          mkdir -p portal/.next
          cp -rL .next/standalone/. portal/
          cp -r public portal/public
          cp -r .next/static portal/.next/static
          cd portal && zip -qr ../portal.zip .

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: portal.zip
